<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Please Forgive Me 💖</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#ffdde1,#ee9ca7,#fad0c4);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

.card{
    background:white;
    padding:35px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 0 25px rgba(0,0,0,0.2);
    width:320px;
    position:relative;
}

h1{
    color:#ff4f81;
    margin-bottom:10px;
}

p{
    font-size:22px;
    color:#444;
}

.flowers{
    font-size:35px;
    margin-bottom:10px;
}

button{
    padding:12px 28px;
    margin:10px;
    border:none;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

#yesButton{
    background:#ff4f81;
    color:white;
}

#yesButton:hover{
    transform:scale(1.1);
    background:#ff2e6b;
}

#noButton{
    background:#777;
    color:white;
}

#noButton:hover{
    transform:scale(1.1);
}

#celebration{
    display:none;
    margin-top:20px;
    animation:pop 0.8s ease;
}

@keyframes pop{
    0%{transform:scale(0);}
    100%{transform:scale(1);}
}

.confetti{
    position:absolute;
    font-size:30px;
    animation:fall 4s linear infinite;
}

@keyframes fall{
    from{
        transform:translateY(-120vh) rotate(0deg);
    }
    to{
        transform:translateY(120vh) rotate(360deg);
    }
}
</style>

</head>

<body>

<div class="confetti" style="left:10%;">🎉</div>
<div class="confetti" style="left:25%;animation-delay:1s;">🌸</div>
<div class="confetti" style="left:40%;animation-delay:2s;">🌺</div>
<div class="confetti" style="left:60%;animation-delay:.5s;">💖</div>
<div class="confetti" style="left:75%;animation-delay:1.5s;">🌹</div>
<div class="confetti" style="left:90%;animation-delay:2.5s;">✨</div>

<div class="card">

<div class="flowers">🌹🌸🌷💐🌺</div>

<h1>I'm Sorry ❤️</h1>

<p>Please forgive me.</p>

<button id="yesButton">Yes 💖</button>
<button id="noButton">No 😔</button>

<div id="celebration">
    <h2>🎉 Thank You! 🎉</h2>
    <p>💖 You just made my day! 💖</p>
    <div style="font-size:60px;">🥳🎊🎉💐🌹❤️</div>
</div>

</div>

<script>
document.getElementById("yesButton").onclick=function(){
    document.getElementById("celebration").style.display="block";
    alert("🥳 Yay! Thank you for forgiving me! ❤️");
};

document.getElementById("noButton").onclick=function(){
    alert("😔 I'll keep trying. You're really important to me. 🌹");
};
</script>

</body>
</html>
